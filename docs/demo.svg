<text x="430" y="23" text-anchor="middle" fill="#8b949e" style="opacity:1;font-size:12px">self-clone · illustrative run (examples/acme)</text>
<text class="l0" x="24" y="64" xml:space="preserve"><tspan fill="#7ee787">~/self-clone-home</tspan><tspan fill="#8b949e"> $ </tspan><tspan fill="#e6edf3">claude</tspan></text>
<text class="l1" x="24" y="88" xml:space="preserve"><tspan fill="#8b949e">&gt; </tspan><tspan fill="#e6edf3">/loop /grow</tspan></text>
<text class="l2" x="24" y="112" xml:space="preserve"><tspan fill="#79c0ff">grow</tspan><tspan fill="#8b949e">  work/bugs/regression       </tspan><tspan fill="#e6edf3">split by how Alex closes it → bisect · hotfix</tspan></text>
<text class="l3" x="24" y="136" xml:space="preserve"><tspan fill="#79c0ff">grow</tspan><tspan fill="#8b949e">  …/local-repro/first-bad-commit </tspan><tspan fill="#56d364">settled</tspan><tspan fill="#e6edf3"> — cases 2 · exam 3</tspan></text>
<text class="l4" x="24" y="160" xml:space="preserve"><tspan fill="#79c0ff">grow</tspan><tspan fill="#8b949e">  org/colleagues/platform    </tspan><tspan fill="#e6edf3">stub → growing, unknowns 2</tspan></text>
<text class="l5" x="24" y="184" xml:space="preserve"><tspan fill="#f2cc60">@exam</tspan><tspan fill="#e6edf3"> replay ACME-388 </tspan><tspan fill="#8b949e">&quot;checkout returns 500 after deploy&quot;</tspan></text>
<text class="l6" x="24" y="208" xml:space="preserve"><tspan fill="#e6edf3">      answered from the tree only · graded against the real ticket</tspan></text>
