<text class="l9" x="24" y="280" xml:space="preserve"><tspan fill="#79c0ff">grow</tspan><tspan fill="#8b949e">  work/releases/rollback     </tspan><tspan fill="#e6edf3">[exam] rollback command + who approves it</tspan></text>
<text class="l10" x="24" y="304" xml:space="preserve"><tspan fill="#f2cc60">@exam</tspan><tspan fill="#e6edf3"> retake ACME-388</tspan></text>
<text class="l11" x="24" y="328" xml:space="preserve"><tspan fill="#56d364">      23/25</tspan><tspan fill="#e6edf3">  can replace ✓</tspan><tspan fill="#8b949e">   next frontier: work/bugs/flaky-tests</tspan></text>
